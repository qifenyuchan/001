<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Northstar · 记忆仓库</title>
<style>
  :root{
    --bg:#f6f7f9; --surface:#ffffff; --surface-2:#fafbfc; --line:#e6e8ec; --line-strong:#d6dae1;
    --text:#101828; --text-2:#475467; --muted:#98a2b3; --accent:#2563eb; --accent-soft:#eff4ff;
    --ok:#12b76a; --warn:#f79009; --danger:#f04438; --violet:#7a5af8;
    --radius:10px; --shadow:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06);
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    --mono:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;
  }
  html[data-theme="dark"]{
    --bg:#0d1117; --surface:#161b22; --surface-2:#1b212a; --line:#2a313c; --line-strong:#3a4350;
    --text:#e6edf3; --text-2:#a9b4c0; --muted:#6e7b8b; --accent:#58a6ff; --accent-soft:#14263d;
    --ok:#3fb950; --warn:#d29922; --danger:#f85149; --violet:#a78bfa;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 1px 3px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);font:13px/1.55 var(--font);-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0}
  input,textarea{font:inherit;color:inherit}
  a{color:inherit;text-decoration:none}
  .top{height:52px;display:flex;align-items:center;gap:14px;padding:0 16px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
  .brand{display:flex;align-items:center;gap:8px;font-weight:650;font-size:14px;letter-spacing:.2px;white-space:nowrap}
  .logo{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,var(--accent),var(--violet));color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
  .brand .sub{color:var(--muted);font-weight:500;font-size:12px}
  .space-pill{display:flex;align-items:center;gap:6px;height:28px;padding:0 10px;border:1px solid var(--line);border-radius:7px;color:var(--text-2);font-size:12px;background:var(--surface-2)}
  .space-pill i{width:6px;height:6px;border-radius:50%;background:var(--ok);display:inline-block}
  .search{flex:1;max-width:520px;position:relative}
  .search input{width:100%;height:32px;padding:0 34px 0 32px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);color:var(--text);outline:none;font-size:13px}
  .search input:focus{border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px var(--accent-soft)}
  .search .icon{position:absolute;left:10px;top:8px;color:var(--muted);font-size:13px}
  .search kbd{position:absolute;right:8px;top:7px;font:11px var(--mono);color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 4px;background:var(--surface)}
  .top-right{margin-left:auto;display:flex;align-items:center;gap:10px}
  .sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2);padding:4px 8px;border-radius:7px}
  .sync .dot{width:6px;height:6px;border-radius:50%;background:var(--ok)}
  .sync.alert .dot{background:var(--warn)}
  .icon-btn{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;color:var(--text-2)}
  .icon-btn:hover{background:var(--surface-2)}
  .shell{display:grid;grid-template-columns:232px minmax(0,1fr) 0;height:calc(100vh - 52px);transition:grid-template-columns .18s ease}
  .shell.with-panel{grid-template-columns:232px minmax(0,1fr) 400px}
  .side{border-right:1px solid var(--line);padding:14px 10px;overflow:auto;background:var(--surface)}
  .nav-group{display:flex;flex-direction:column;gap:2px;margin-bottom:18px}
  .nav-item{display:flex;align-items:center;gap:9px;height:32px;padding:0 10px;border-radius:7px;color:var(--text-2);font-size:13px}
  .nav-item svg{width:15px;height:15px;opacity:.75}
  .nav-item:hover{background:var(--surface-2);color:var(--text)}
  .nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
  .nav-item .count{margin-left:auto;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
  .nav-item.active .count{color:var(--accent)}
  .side-title{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:0 10px;margin-bottom:6px}
  .side-sessions{display:flex;flex-direction:column;gap:1px}
  .side-session{display:flex;align-items:center;gap:8px;height:30px;padding:0 10px;border-radius:7px;color:var(--text-2);font-size:12.5px;cursor:pointer}
  .side-session:hover{background:var(--surface-2);color:var(--text)}
  .side-session.active{background:var(--surface-2);color:var(--text);font-weight:600}
  .side-session .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .side-session .n{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
  main{overflow:auto;min-width:0}
  .main-head{position:sticky;top:0;z-index:5;background:var(--bg);padding:18px 24px 10px;display:flex;align-items:flex-end;gap:14px}
  .main-head h1{margin:0;font-size:17px;font-weight:650;letter-spacing:-.01em}
  .main-head .sub{color:var(--muted);font-size:12px;margin-bottom:2px}
  .filters{margin-left:auto;display:flex;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:2px}
  .filters button{height:26px;padding:0 10px;border-radius:6px;font-size:12px;color:var(--text-2)}
  .filters button.active{background:var(--surface-2);color:var(--text);font-weight:600;box-shadow:var(--shadow)}
  .list{padding:0 12px 60px}
  .row{display:grid;grid-template-columns:54px minmax(0,1fr) auto;gap:12px;padding:10px 12px;border-radius:9px;cursor:pointer;border:1px solid transparent}
  .row:hover{background:var(--surface);border-color:var(--line);box-shadow:var(--shadow)}
  .row.active{background:var(--surface);border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .row-time{font:11px/1.35 var(--mono);color:var(--muted);text-align:right;padding-top:2px;font-variant-numeric:tabular-nums}
  .row-main{min-width:0}
  .row-title{display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:550;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tag{font:11px var(--mono);color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:0 5px;line-height:17px;flex:none}
  .tag.range{color:var(--violet);border-color:color-mix(in srgb,var(--violet) 30%,transparent)}
  .dot{width:6px;height:6px;border-radius:50%;flex:none}
  .dot.complete{background:var(--ok)} .dot.partial{background:var(--warn)} .dot.degraded{background:var(--muted)}
  .row-excerpt{color:var(--text-2);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
  .row-meta{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:11px;white-space:nowrap;font-variant-numeric:tabular-nums}
  .row-meta .badge{color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);border-radius:5px;padding:0 5px;line-height:16px}
  .row-meta .session{max-width:96px;overflow:hidden;text-overflow:ellipsis;display:inline-block;vertical-align:bottom}
  .row.range-row{border-left:2px solid color-mix(in srgb,var(--violet) 55%,transparent);border-radius:2px 9px 9px 2px}
  .row.range-row .row-title{color:var(--text-2)}
  .ex-label{color:var(--violet);font-size:11px;border:1px solid color-mix(in srgb,var(--violet) 30%,transparent);border-radius:4px;padding:0 4px;margin-right:5px;line-height:15px;display:inline-block;vertical-align:1px}
  .empty{padding:80px 20px;text-align:center;color:var(--muted)}
  .empty h3{color:var(--text-2);font-size:14px;font-weight:600;margin:0 0 6px}
  .load-more{display:block;margin:18px auto 0;height:32px;padding:0 16px;border:1px solid var(--line);border-radius:8px;color:var(--text-2);background:var(--surface);font-size:12.5px}
  .load-more:hover{border-color:var(--line-strong)}
  .panel{border-left:1px solid var(--line);background:var(--surface);overflow:auto;display:none}
  .shell.with-panel .panel{display:block}
  .panel-head{position:sticky;top:0;background:var(--surface);padding:16px 18px 12px;border-bottom:1px solid var(--line);z-index:3}
  .panel-head .t{display:flex;align-items:flex-start;gap:10px}
  .panel-head h2{margin:0;font-size:15px;font-weight:650;line-height:1.4;flex:1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .panel-head .meta{display:flex;flex-wrap:wrap;gap:8px;color:var(--muted);font-size:11.5px;margin-top:6px;font-variant-numeric:tabular-nums}
  .pill{border:1px solid var(--line);border-radius:999px;padding:0 7px;line-height:18px;font-size:11px;color:var(--text-2)}
  .pill.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 35%,transparent)}
  .pill.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
  .panel-body{padding:14px 18px}
  .fld{margin-bottom:10px}
  .fld label{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:3px;letter-spacing:.02em}
  .fld label .miss{color:var(--warn)}
  .fld textarea{width:100%;min-height:34px;padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--surface-2);resize:none;outline:none;font-size:13px;line-height:1.55}
  .fld textarea:focus{border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px var(--accent-soft)}
  .fld textarea.missing{border-color:color-mix(in srgb,var(--warn) 55%,transparent)}
  .fld textarea.dirty{border-color:var(--accent)}
  details.raw{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
  details.raw summary{cursor:pointer;color:var(--text-2);font-size:12px;user-select:none}
  details.raw textarea{width:100%;margin-top:8px;min-height:120px;padding:9px;border:1px solid var(--line);border-radius:7px;background:var(--surface-2);color:var(--text-2);font:12px/1.55 var(--mono);resize:vertical;outline:none}
  .panel-foot{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 18px;display:flex;align-items:center;gap:8px}
  .btn{height:30px;padding:0 12px;border-radius:7px;border:1px solid var(--line);background:var(--surface);color:var(--text-2);font-size:12.5px}
  .btn:hover{border-color:var(--line-strong);color:var(--text)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .btn.primary:disabled{opacity:.45;cursor:default}
  .btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 35%,transparent)}
  .btn.ghost{border-color:transparent}
  .spacer{flex:1}
  .conflict{border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:12px 14px;margin:0 12px 10px}
  .conflict h3{margin:0 0 4px;font-size:13px}
  .conflict .meta{color:var(--muted);font-size:11.5px}
  .conflict .fields{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
  .conflict .field{font-size:11px;border:1px solid var(--line);border-radius:5px;padding:0 6px;line-height:18px;color:var(--text-2)}
  .trash-row{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line)}
  .trash-row:last-child{border-bottom:none}
  .trash-row .info{flex:1;min-width:0}
  .trash-row .title{font-size:13px;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .trash-row .meta{color:var(--muted);font-size:11.5px}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(8px);background:var(--text);color:var(--surface);border-radius:8px;padding:8px 14px;font-size:12.5px;opacity:0;pointer-events:none;transition:.2s;z-index:50;max-width:70vw}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .skeleton{height:52px;border-radius:9px;margin:6px 12px;background:linear-gradient(90deg,var(--surface-2) 25%,var(--line) 37%,var(--surface-2) 63%);background-size:400% 100%;animation:sh 1.2s infinite}
  @keyframes sh{0%{background-position:100% 0}100%{background-position:0 0}}
  @media(max-width:1100px){.shell.with-panel{grid-template-columns:212px minmax(0,1fr) 360px}}
  @media(max-width:900px){.shell{grid-template-columns:1fr}.side{display:none}.shell.with-panel{grid-template-columns:1fr}.panel{position:fixed;inset:52px 0 0;z-index:30;width:100%}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo">N</span>Northstar<span class="sub">记忆仓库</span></div>
  <button class="space-pill" id="spacePill"><i></i><span>个人空间</span></button>
  <div class="search">
    <span class="icon">⌕</span>
    <input id="q" placeholder="搜索事情、结果、重点…" autocomplete="off">
    <kbd>/</kbd>
  </div>
  <div class="top-right">
    <div class="sync" id="sync"><span class="dot"></span><span id="syncText">本机</span></div>
    <button class="icon-btn" id="themeBtn" title="切换主题">◐</button>
  </div>
</header>
<div class="shell" id="shell">
  <nav class="side">
    <div class="nav-group">
      <a class="nav-item" data-nav="all" href="#/all"><span>◫</span>记忆流<span class="count" id="cAll"></span></a>
      <a class="nav-item" data-nav="sessions" href="#/sessions"><span>▤</span>会话<span class="count" id="cSess"></span></a>
      <a class="nav-item" data-nav="conflicts" href="#/conflicts"><span>⇄</span>冲突<span class="count" id="cConf"></span></a>
      <a class="nav-item" data-nav="trash" href="#/trash"><span>⌫</span>回收站<span class="count" id="cTrash"></span></a>
    </div>
    <div class="side-title">会话</div>
    <div class="side-sessions" id="sideSessions"></div>
  </nav>
  <main id="main"></main>
  <aside class="panel" id="panel"></aside>
</div>
<div class="toast" id="toast"></div>
<script>
"use strict";
const $=s=>document.querySelector(s);
const FIELDS=["时间","地点","人物","事情","原因","结果","重点"];
const state={stats:null,sessions:[],view:"all",filter:"all",q:"",selected:null,records:[],page:1,pages:1,total:0,trash:[],conflicts:[],dirty:false};
let deleteArm={id:"",until:0};

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function fmt(ts){if(!ts)return"—";const d=new Date(ts),p=n=>("0"+n).slice(-2);return `${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;}
function fullFmt(ts){if(!ts)return"—";const d=new Date(ts),p=n=>("0"+n).slice(-2);return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;}
function toast(m,ms=2200){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),ms);}
function askToken(){const t=prompt("需要访问令牌。输入后浏览器会记住：");if(t)location.href="/?token="+encodeURIComponent(t);}

async function api(url,opt){
  const r=await fetch(url,opt);
  if(r.status===401){askToken();throw new Error("unauthorized");}
  const j=await r.json();
  if(!r.ok||!j.ok)throw new Error((j&&j.error)||("HTTP "+r.status));
  return j;
}
const post=(u,b)=>api(u,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b||{})});

function themeInit(){
  const param=new URLSearchParams(location.search).get("theme");
  if(param==="dark"||param==="light"){document.documentElement.dataset.theme=param;localStorage.setItem("ns-theme",param);return;}
  const saved=localStorage.getItem("ns-theme");
  const prefers=window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.dataset.theme=saved||(prefers?"dark":"light");
}
function themeToggle(){
  const next=document.documentElement.dataset.theme==="dark"?"light":"dark";
  document.documentElement.dataset.theme=next;localStorage.setItem("ns-theme",next);
}

async function loadBase(){
  const [stats,sessions,conf,trash]=await Promise.all([
    api("/api/stats"),api("/api/sessions"),api("/api/conflicts"),api("/api/trash")
  ]);
  state.stats=stats;state.sessions=sessions.sessions||[];state.conflicts=conf.reports||[];state.trash=trash.items||[];
  $("#cAll").textContent=stats.total;
  $("#cSess").textContent=state.sessions.length;
  $("#cConf").textContent=state.conflicts.length||"";
  $("#cTrash").textContent=state.trash.length||"";
  $("#spacePill span").textContent=stats.space_id==="personal"?"个人空间":stats.space_id;
  const sync=$("#sync"),txt=$("#syncText");
  const confN=state.conflicts.length;
  sync.classList.toggle("alert",confN>0);
  txt.textContent=confN>0?`${confN} 个冲突已合并`:stats.device_id;
  sync.title=`设备 ${stats.device_id} · 墓碑 ${stats.tombstones||0} · 冲突 ${confN}`;
  renderSideSessions();
}
function renderSideSessions(){
  $("#sideSessions").innerHTML=state.sessions.map(s=>`
    <div class="side-session ${state.view==="session"&&state.selectedSession===s.session_key?"active":""}" onclick="go('#/s/${encodeURIComponent(s.session_key)}')">
      <span class="name">${esc(s.name||s.session_key)}</span><span class="n">${s.turn_count}</span>
    </div>`).join("")||`<div class="empty" style="padding:18px 10px;text-align:left;font-size:12px">暂无会话</div>`;
}

function go(h){location.hash=h;}

async function route(){
  const h=location.hash||"#/all";
  document.querySelectorAll(".nav-item").forEach(a=>a.classList.remove("active"));
  if(h.startsWith("#/s/")){
    state.view="session";state.selectedSession=decodeURIComponent(h.slice(4));
    document.querySelector('[data-nav="sessions"]').classList.add("active");
    return renderSession(state.selectedSession);
  }
  if(h.startsWith("#/q/")){
    state.view="search";state.q=decodeURIComponent(h.slice(4));return renderSearch(state.q);
  }
  if(h==="#/sessions"){state.view="sessions";document.querySelector('[data-nav="sessions"]').classList.add("active");return renderSessions();}
  if(h==="#/conflicts"){state.view="conflicts";document.querySelector('[data-nav="conflicts"]').classList.add("active");return renderConflicts();}
  if(h==="#/trash"){state.view="trash";document.querySelector('[data-nav="trash"]').classList.add("active");return renderTrash();}
  if(h.startsWith("#/r/")){
    if(!document.querySelector("#list")){
      if(state.view==="session"&&state.selectedSession) await renderSession(state.selectedSession);
      else await renderFeed(1);
    }
    return openRecord(decodeURIComponent(h.slice(4)),true);
  }
  state.view="all";state.selectedSession=null;
  document.querySelector('[data-nav="all"]').classList.add("active");
  return renderFeed(1);
}

function head(title,sub,filters){
  return `<div class="main-head"><div><h1>${esc(title)}</h1><div class="sub">${esc(sub||"")}</div></div>
    ${filters?`<div class="filters">${filters.map(f=>`<button class="${state.filter===f.k?'active':''}" onclick="setFilter('${f.k}')">${f.n}</button>`).join("")}</div>`:""}</div>`;
}

function rowHtml(r){
  const title=(r.fields&&r.fields["事情"])||"(未命名)";
  const excerpt=(r.fields&&r.fields["结果"])||(r.fields&&r.fields["重点"])||"";
  const isRange=r.kind==="range";
  const tag=isRange?`Σ ${r.range?(r.range.from===r.range.to?r.range.from:r.range.from+"–"+r.range.to):"?"}`:"#"+r.turn_no;
  return `<div class="row ${isRange?"range-row":""} ${state.selected===r.id?"active":""}" onclick="go('#/r/${encodeURIComponent(r.id)}')">
    <div class="row-time">${fmt(r.created_at).replace(" ","<br>")}</div>
    <div class="row-main">
      <div class="row-title"><span class="tag ${isRange?"range":""}">${tag}</span>${esc(title)}<span class="dot ${r.quality}"></span></div>
      <div class="row-excerpt">${isRange?'<span class="ex-label">范围总结</span>':""}${esc(excerpt)}</div>
    </div>
    <div class="row-meta">${r.truncated?'<span class="badge">截断</span>':""}<span class="session" title="${esc(r.session_name||r.session_key)}">${esc(r.session_name||r.session_key)}</span></div>
  </div>`;
}

async function renderFeed(page=1){
  state.filter=state.filter||"all";
  $("#main").innerHTML=head("记忆流",`${state.stats?state.stats.total:0} 条 · 最新在前`,[{k:"all",n:"全部"},{k:"turn",n:"单轮"},{k:"range",n:"范围"},{k:"bad",n:"不完整"}])+
    `<div class="list" id="list"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>`;
  const kind=state.filter==="turn"?"turn":state.filter==="range"?"range":"";
  const j=await api(`/api/list?page=${page}&page_size=30${kind?"&kind="+kind:""}`);
  let records=j.records||[];
  if(state.filter==="bad")records=records.filter(r=>r.quality!=="complete");
  state.records=records;state.page=j.page;state.pages=j.pages;state.total=j.total;
  const list=$("#list");
  if(!records.length){list.innerHTML=`<div class="empty"><h3>还没有记忆</h3><div>让 Agent 在每轮结束时调用 memory_save，这里就会出现。</div></div>`;return;}
  list.innerHTML=records.map(rowHtml).join("")+(j.page<j.pages?`<button class="load-more" onclick="renderFeed(${j.page+1})">加载更多（${j.total} 条）</button>`:"");
}

async function renderSession(key){
  $("#main").innerHTML=head("会话",key)+`<div class="list" id="list"><div class="skeleton"></div></div>`;
  const j=await api("/api/session/"+encodeURIComponent(key));
  const s=j.session,recs=j.records||[];
  const gaps=(s.gaps||[]);
  $("#main").innerHTML=head(s.name||key,`${s.turn_count} 轮 · ${s.range_count} 范围 · ${s.last_at?fmt(s.last_at):"—"}${gaps.length?" · 缺口 "+gaps.join(","):""}`)+
    `<div class="list">${recs.map(rowHtml).join("")||'<div class="empty"><h3>空会话</h3></div>'}</div>`;
}

async function renderSessions(){
  $("#main").innerHTML=head("会话",`${state.sessions.length} 个会话`)+`<div class="list">${state.sessions.map(s=>`
    <div class="row" onclick="go('#/s/${encodeURIComponent(s.session_key)}')">
      <div class="row-time">${fmt(s.last_at).replace(" ","<br>")}</div>
      <div class="row-main"><div class="row-title">${esc(s.name||s.session_key)} ${s.gaps&&s.gaps.length?`<span class="tag">缺口 ${s.gaps.length}</span>`:""}</div>
      <div class="row-excerpt">${s.turn_count} 轮 · ${s.range_count} 个范围总结</div></div>
      <div class="row-meta"><span>${esc(s.session_key)}</span></div>
    </div>`).join("")||'<div class="empty"><h3>暂无会话</h3></div>'}</div>`;
}

async function renderSearch(q){
  $("#main").innerHTML=head("搜索",`“${q}”`)+`<div class="list" id="list"><div class="skeleton"></div></div>`;
  const j=await api("/api/search?q="+encodeURIComponent(q)+"&limit=50");
  const rows=(j.results||[]).map(r=>`<div class="row" onclick="go('#/r/${encodeURIComponent(r.id)}')">
    <div class="row-time">${fmt(r.created_at).replace(" ","<br>")}</div>
    <div class="row-main"><div class="row-title"><span class="tag">${r.kind==="range"?"Σ":"#"+r.turn_no}</span>${esc(r.title)}</div>
    <div class="row-excerpt">${esc(r.excerpt)}</div></div>
    <div class="row-meta"><span>${esc(r.session_key)}</span></div></div>`).join("");
  $("#list").innerHTML=rows||`<div class="empty"><h3>没有命中</h3><div>换个关键词试试。</div></div>`;
}

async function renderTrash(){
  $("#main").innerHTML=head("回收站",`${state.trash.length} 项 · 删除可恢复`)+`<div class="list" style="padding-top:4px">${state.trash.map(t=>`
    <div class="trash-row">
      <div class="info"><div class="title">${esc((t.record.fields&&t.record.fields["事情"])||"(无标题)")}</div>
      <div class="meta">${esc(t.record.session_key)} · 删除于 ${fullFmt(t.deleted_at)} · ${esc(t.reason)}</div></div>
      <button class="btn" onclick="restoreTrash('${t.trash_id}')">恢复</button>
      <button class="btn danger" onclick="purgeTrash('${t.trash_id}')">彻底删除</button>
    </div>`).join("")||'<div class="empty"><h3>回收站为空</h3></div>'}</div>`;
}

async function renderConflicts(){
  const reports=state.conflicts||[];
  $("#main").innerHTML=head("冲突",`${reports.length} 个冲突副本已按字段合并并归档`)+
    `<div style="padding-top:6px">${reports.map(r=>`
      <div class="conflict">
        <h3>${esc(r.conflict_file||"冲突副本")}</h3>
        <div class="meta">${fullFmt(new Date(r.at).getTime())} · 合并到 ${esc(r.target_id||"—")} · 设备 ${esc(r.device||"—")}</div>
        <div class="fields">${(r.fields||[]).map(f=>`<span class="field">${esc(f)}：保留较新值</span>`).join("")||'<span class="field">无字段冲突</span>'}</div>
      </div>`).join("")||'<div class="empty"><h3>没有冲突</h3><div>多设备同步产生冲突副本时，会自动按字段合并并记录在这里。</div></div>'}</div>`;
}

async function restoreTrash(id){
  try{await post("/api/restore",{trash_id:id});toast("已恢复");await loadBase();renderTrash();}
  catch(e){toast("恢复失败："+e.message);}
}
async function purgeTrash(id){
  const s=prompt("彻底删除不可恢复。输入 PURGE 确认：");if(s!=="PURGE")return;
  try{await post("/api/purge",{trash_id:id});toast("已彻底删除");await loadBase();renderTrash();}
  catch(e){toast("失败："+e.message);}
}

async function openRecord(id,keepView){
  let rec;
  try{rec=await api("/api/record/"+encodeURIComponent(id)).then(j=>j.record);}
  catch(e){toast("找不到该记录");return;}
  state.selected=id;state.dirty=false;
  $("#shell").classList.add("with-panel");
  const miss=new Set(rec.missing||[]);
  const fieldsHtml=FIELDS.map(k=>{
    const v=(rec.fields&&rec.fields[k])||"";
    const rows=k==="时间"?1:(k==="地点"||k==="人物")?2:3;
    return `<div class="fld"><label><span>${k}</span>${miss.has(k)?'<span class="miss">缺失</span>':""}</label>
      <textarea id="f-${k}" data-field="${k}" class="${miss.has(k)?"missing":""}" rows="${rows}">${esc(v)}</textarea></div>`;
  }).join("");
  $("#panel").innerHTML=`
    <div class="panel-head">
      <div class="t"><h2>${esc((rec.fields&&rec.fields["事情"])||"(未命名)")}</h2><button class="icon-btn" onclick="closePanel()">✕</button></div>
      <div class="meta">
        <span class="pill">${rec.kind==="range"?"范围 "+rec.range.from+"–"+rec.range.to:"第 "+rec.turn_no+" 轮"}</span>
        <span class="pill ${rec.quality==="complete"?"ok":"warn"}">${rec.quality==="complete"?"完整":rec.quality==="partial"?"部分":"骨架"}</span>
        ${rec.truncated?'<span class="pill warn">截断轮</span>':""}
        <span>${esc(rec.session_key)}</span><span>${fullFmt(rec.created_at)}</span><span>r${rec.revision}</span>
      </div>
    </div>
    <div class="panel-body">
      ${fieldsHtml}
      <details class="raw"><summary>原文（${rec.raw_text?rec.raw_text.length:0} 字，仅本地）</summary>
        <textarea id="f-raw">${esc(rec.raw_text||"")}</textarea></details>
    </div>
    <div class="panel-foot">
      <button class="btn primary" id="saveBtn" disabled onclick="saveRecord('${rec.id}',${rec.revision})">保存</button>
      <span class="spacer"></span>
      <button class="btn danger" id="delBtn" onclick="delRecord('${rec.id}')">删除</button>
    </div>`;
  $("#panel").querySelectorAll("textarea").forEach(t=>{
    t.addEventListener("input",()=>{t.classList.add("dirty");state.dirty=true;$("#saveBtn").disabled=false;});
  });
  // 列表行高亮
  document.querySelectorAll(".row").forEach(el=>el.classList.remove("active"));
  const row=[...document.querySelectorAll(".row")].find(el=>el.getAttribute("onclick")&&el.getAttribute("onclick").includes(rec.id));
  if(row)row.classList.add("active");
}
function closePanel(){
  $("#shell").classList.remove("with-panel");
  state.selected=null;document.querySelectorAll(".row").forEach(el=>el.classList.remove("active"));
  if(location.hash.startsWith("#/r/"))history.replaceState(null,"",location.hash.split("#/r/")[0]||"#/all");
}
async function saveRecord(id,rev){
  const fields={};FIELDS.forEach(k=>{const el=document.getElementById("f-"+k);if(el)fields[k]=el.value.trim();});
  const raw=document.getElementById("f-raw");
  const body={id,fields,raw_text:raw?raw.value:"",expect_revision:rev};
  try{
    const j=await post("/api/update",body);toast("已保存 · r"+j.record.revision);
    state.dirty=false;await loadBase();await openRecord(id,true);
  }catch(e){
    if(String(e.message).includes("revision mismatch")){
      if(confirm("该记录已被其他设备修改。仍用当前编辑覆盖吗？")){
        delete body.expect_revision;
        try{const j=await post("/api/update",body);toast("已覆盖保存 · r"+j.record.revision);await loadBase();await openRecord(id,true);}
        catch(e2){toast("保存失败："+e2.message);}
      }
    }else toast("保存失败："+e.message);
  }
}
async function delRecord(id){
  const now=Date.now();
  if(deleteArm.id!==id||now>deleteArm.until){deleteArm={id,until:now+3000};const b=$("#delBtn");if(b)b.textContent="确认删除？";return;}
  try{await post("/api/delete",{id,confirm:true});toast("已删除，可在回收站恢复");closePanel();await loadBase();route();}
  catch(e){toast("删除失败："+e.message);}
}
function setFilter(k){state.filter=k;renderFeed(1);}

$("#q").addEventListener("keydown",e=>{
  if(e.key==="Enter"){const q=e.target.value.trim();if(q)go("#/q/"+encodeURIComponent(q));}
});
document.addEventListener("keydown",e=>{
  if(e.key==="/"&&document.activeElement!==$("#q")){e.preventDefault();$("#q").focus();}
  if(e.key==="Escape")closePanel();
});
$("#themeBtn").onclick=themeToggle;
window.addEventListener("hashchange",()=>{state.selected=null;$("#shell").classList.remove("with-panel");route();});

(async()=>{themeInit();await loadBase();await route();})();
</script>
</body>
</html>
