<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Northstar · 记忆仓库</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="top">
  <button class="icon-btn side-toggle" id="sideBtn" title="会话列表" aria-label="切换会话列表">☰</button>
  <div class="brand"><span class="logo">N</span><span class="brand-name">Northstar</span><span class="sub">记忆仓库</span></div>
  <button class="space-pill" id="spacePill"><i></i><span>个人空间</span></button>
  <div class="search">
    <span class="icon">⌕</span>
    <input id="q" placeholder="搜索事情、结果、重点…" autocomplete="off">
    <kbd>/</kbd>
  </div>
  <div class="top-right">
    <div class="sync" id="sync"><span class="dot"></span><span id="syncText">本机</span></div>
    <button class="icon-btn" id="themeBtn" title="切换主题" aria-label="切换主题">◐</button>
  </div>
</header>
<div class="shell" id="shell">
  <nav class="side" id="side">
    <div class="nav-group">
      <a class="nav-item" data-nav="all" href="#/all"><span>◫</span>记忆流<span class="count" id="cAll"></span></a>
      <a class="nav-item" data-nav="sessions" href="#/sessions"><span>▤</span>会话<span class="count" id="cSess"></span></a>
      <a class="nav-item" data-nav="conflicts" href="#/conflicts"><span>⇄</span>冲突<span class="count" id="cConf"></span></a>
      <a class="nav-item" data-nav="trash" href="#/trash"><span>⌫</span>回收站<span class="count" id="cTrash"></span></a>
    </div>
    <div class="side-title">会话</div>
    <div class="side-sessions" id="sideSessions"></div>
    <div class="side-title" style="margin-top:18px">字段方案</div>
    <div class="profile-box">
      <select id="profileSwitch" aria-label="切换字段方案"></select>
      <div class="profile-note">新写入使用当前方案；历史记录保留可读</div>
    </div>
  </nav>
  <main id="main"></main>
  <aside class="panel" id="panel"></aside>
  <div class="resize-handle" id="resizeHandle" title="拖动调整宽度（双击复位）"></div>
  <div class="backdrop" id="backdrop"></div>
</div>
<div class="toast" id="toast"></div>
<script src="/app.js" defer></script>
</body>
</html>
