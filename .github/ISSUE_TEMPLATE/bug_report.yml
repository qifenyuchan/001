name: Bug report
description: 报告一个可复现的问题
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        请先运行 `node dist/cli.js sync doctor` 并把输出贴上来（如涉及同步/数据）。
        提交前请确认不包含 API key、令牌或敏感记忆内容。
  - type: textarea
    id: what
    attributes:
      label: 发生了什么
      description: 实际行为 vs 期望行为
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 启动 ...
        2. 调用 memory_save ...
        3. 看到 ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本
      placeholder: "2.4.0（node dist/cli.js stats 里的 version）"
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 环境
      placeholder: "Windows 11 / Node 22 / WorkBuddy 或 Cursor ..."
  - type: textarea
    id: logs
    attributes:
      label: 日志或截图
      description: data/logs/server.log 相关片段（注意脱敏）
